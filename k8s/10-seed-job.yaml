apiVersion: batch/v1
kind: Job
metadata:
  name: travelo-seed
  namespace: travelo
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: travelo-seed
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: mysql:8.4
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: travelo-secret
                  key: MYSQL_ROOT_PASSWORD
          command:
            - sh
            - -c
            - |
              echo "Attente des tables creees par le backend..."
              until mysql -h travelo-database -uroot -N -e "SELECT COUNT(*) FROM flight" travelo_db >/dev/null 2>&1; do
                sleep 5
              done
              COUNT=$(mysql -h travelo-database -uroot -N -e "SELECT COUNT(*) FROM flight" travelo_db)
              if [ "$COUNT" = "0" ]; then
                mysql -h travelo-database -uroot travelo_db < /seed/seed.sql && echo "Donnees inserees."
              else
                echo "Donnees deja presentes ($COUNT vols), rien a faire."
              fi
          volumeMounts:
            - name: seed
              mountPath: /seed
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: seed
          configMap:
            name: travelo-seed
